name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # SUPABASE_URL / SUPABASE_ANON_KEY are empty on CI: the values only feed
      # BuildConfig constants, so the build and the unit tests are still real.
      - name: Create local.properties
        run: cp local.properties.example local.properties

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      # Belt and braces for M1's "no service_role anywhere in the APK".
      - name: Assert no service_role key in the APK
        run: |
          set -euo pipefail
          if unzip -p app/build/outputs/apk/debug/app-debug.apk 'classes*.dex' \
              | strings | grep -q 'service_role'; then
            echo "::error::service_role found in the debug APK"
            exit 1
          fi
          echo "no service_role in the APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  rls-tests:
    name: Supabase migrations + pgTAP RLS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-supabase@v1

      - name: Start local stack
        run: supabase start

      # Proves the committed migration chain applies cleanly from scratch.
      - name: Apply migrations
        run: supabase db reset

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop local stack
        if: always()
        run: supabase stop
