name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # SUPABASE_URL / SUPABASE_ANON_KEY are empty on CI: the values only feed
      # BuildConfig constants, so the build and the unit tests are still real.
      - name: Create local.properties
        run: cp local.properties.example local.properties

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Unit tests
        run: ./gradlew --no-daemon test

      # Both apps must lint clean (PLAN-SPLIT §7 M0).
      - name: Lint both apps
        run: ./gradlew --no-daemon :app-parent:lintDebug :app-child:lintDebug

      # Two apps, one library set (PLAN-SPLIT §2): both must build.
      - name: Assemble debug APKs
        run: ./gradlew --no-daemon :app-parent:assembleDebug :app-child:assembleDebug

      # Belt and braces for M1's "no service_role anywhere in the APK".
      - name: Assert no service_role key in either APK
        run: |
          set -euo pipefail
          for apk in app-parent/build/outputs/apk/debug/app-parent-debug.apk \
                     app-child/build/outputs/apk/debug/app-child-debug.apk; do
            if unzip -p "$apk" 'classes*.dex' | strings | grep -q 'service_role'; then
              echo "::error::service_role found in $apk"
              exit 1
            fi
            echo "no service_role in $apk"
          done

      - name: Assert the child app carries no account/auth UI
        run: |
          set -euo pipefail
          ./gradlew -q :app-child:dependencies --configuration debugRuntimeClasspath \
            > /tmp/child-deps.txt
          # The child app must never be able to create a parent account.
          if grep -q ':feature:onboarding' /tmp/child-deps.txt; then
            echo "::error:::app-child must not depend on :feature:onboarding"
            exit 1
          fi
          echo "child app has no onboarding/sign-up surface"

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: |
            app-parent/build/outputs/apk/debug/*.apk
            app-child/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  rls-tests:
    name: Supabase migrations + pgTAP RLS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-supabase@v1

      - name: Start local stack
        run: supabase start

      # Proves the committed migration chain applies cleanly from scratch.
      - name: Apply migrations
        run: supabase db reset

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop local stack
        if: always()
        run: supabase stop
