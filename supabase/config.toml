# Supabase local configuration for FamilyGuard.
# Generated for the Supabase CLI; `supabase init` regenerates this file if you
# ever need to recreate it. See README.md for the workflow.

project_id = "familyguard"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
# Local email capture: the verification link shows up here during development.
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Mirrors production: a parent who signs up must verify before they can use
# the app, which is exactly what the ConfirmationRequired screen implements.
enable_confirmations = true

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false
